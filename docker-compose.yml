version: '3.8'

services:
  php:
    build: 
      context: .
      dockerfile: Dockerfile
      target: production
    env_file: .env
    container_name: "${APP_NAME}-php"
    volumes:
      - documents:/var/www/html/documents
    restart: always
    ports:
      - "${APP_PORT:-8080}:80"
volumes:
  documents:
    driver: local

networks:
  default:
    name: "dermaplastic"